name: checks

# The repo is private and runs on the free minutes, so this runs once per
# change and no more. A pull request is tested as it would be after the merge,
# which is why there is no second run on main; run it by hand from the Actions
# tab when main needs checking on its own.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "tools/eval/results/**"
  workflow_dispatch:

# A new push to a branch makes the run for the old one worthless.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    # A normal run is about 13 minutes. One that is still going at 30 has a
    # scenario drawing frames it does not need (it has happened).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only the firmware's own dependencies. The emulator's test suite runs
      # without a sound card, a display or PortAudio, and keeping it that way
      # is the point of the headless rig.
      - name: Install
        run: pip install -r firmware/requirements.txt

      - name: firmware/ stays installable on a robot
        run: python -m tools.check_layout

      - name: The emulator's scenarios
        run: python -u -m tools.emulator.headless

      # The baked face data is generated from an After Effects export that
      # lives outside this repo, so CI can only check it when the export is
      # there. `--check` says so and passes rather than failing on a machine
      # that was never going to have it.
      - name: Face data is not stale
        run: python -m tools.face.bake --check

      - name: A release can still be built and signed
        run: |
          python -m tools.release keygen --out /tmp/ci-key.json
          python -m tools.release build \
            --version "$(cat firmware/VERSION)" \
            --out /tmp/dist --key /tmp/ci-key.json
          python - <<'PY'
          import json
          from firmware.updates import signing
          manifest = json.load(open("/tmp/dist/update.json"))
          key = bytes.fromhex(json.load(open("/tmp/ci-key.json"))["public"])
          ok, key_id, reason = signing.check(manifest, [key])
          assert ok, reason
          print("manifest verifies against key", key_id)
          PY

      # Says in the team's Discord channel how the run went. Pinned to a
      # commit, because this step is the only one that is handed a secret. A
      # run with no webhook set (a fork, a new clone of the repo) skips the
      # message and still passes.
      - name: Tell Discord
        if: always()
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: checks
          nofail: true
