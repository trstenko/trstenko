# The setup hotspot's captive portal (firmware/webui/captive.py).
#
# NetworkManager's shared mode runs its own dnsmasq for the hotspot and reads
# this directory, so this applies to the hotspot and to nothing else. Every
# name resolves to the device; a phone's "am I online" check then reaches the
# device, is redirected, and the phone opens the setup page by itself.
#
# Install:  sudo cp trstenko-captive.conf /etc/NetworkManager/dnsmasq-shared.d/
address=/#/10.42.0.1
