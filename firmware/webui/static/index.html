<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trstenko</title>
<style>
/* The device serves this from its own access point. There is no route to the
   internet here, so every font is a system font and every byte is in this
   file -- a stylesheet link would block until it times out. */
:root {
  --panel: #12191d;
  --ink: #e6eef1;
  --dim: #8fa3aa;
  --rule: #24313700;
  --line: #243137;
  --teal: #1b7f9b;
  --teal-lift: #2497b6;
  --amber: #9b6c1b;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo,
          Consolas, monospace;
  --text: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 0 16px 64px;
  background: var(--panel);
  color: var(--ink);
  font: 16px/1.5 var(--text);
  -webkit-text-size-adjust: 100%;
}
main { max-width: 34rem; margin: 0 auto; }

h1 {
  font-size: 1.9rem;
  font-weight: 620;
  letter-spacing: -0.01em;
  margin: 40px 0 6px;
}
h1 span { color: var(--teal-lift); }
.lede { color: var(--dim); margin: 0 0 32px; }

h2 {
  font-size: 1.15rem;
  font-weight: 620;
  margin: 0 0 14px;
  padding-top: 26px;
}
section { border-top: 1px solid var(--line); margin-top: 26px; }
section:first-of-type { border-top: 0; margin-top: 0; }

/* The ledger. Every fact on this page is a label and a value, so there is one
   row shape and it repeats. */
.row {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
}
.row:last-child { border-bottom: 0; }
.row dt, .row .k { color: var(--dim); flex: 0 0 auto; }
.row dd, .row .v {
  margin: 0;
  font-family: var(--mono);
  font-size: 0.86rem;
  text-align: right;
  overflow-wrap: anywhere;
}
dl { margin: 0; }

.fail .v, .fail .k { color: var(--amber); }
.warn .v { color: var(--dim); }
.ok .v { color: var(--ink); }

.headline {
  font-size: 1.05rem;
  margin: 0 0 4px;
}
.detail { color: var(--dim); margin: 0 0 18px; }
.detail:last-child { margin-bottom: 0; }

.notice {
  border-left: 2px solid var(--amber);
  padding: 2px 0 2px 14px;
  margin: 0 0 18px;
}
.notice .headline { color: var(--amber); }

.bar {
  height: 3px;
  background: var(--line);
  margin: 16px 0;
}
.bar i {
  display: block;
  height: 100%;
  width: 0;
  background: var(--teal);
  transition: width 240ms cubic-bezier(0.22, 1, 0.36, 1);
}

.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }

.pinrow { display: flex; gap: 10px; margin: 0 0 10px; }
.pinrow input {
  font-family: var(--mono);
  font-size: 1.3rem;
  letter-spacing: 0.35em;
  width: 7.5em;
  padding: 8px 12px;
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 2px;
}
.pinrow input:focus { outline: none; border-color: var(--teal); }
button {
  font: inherit;
  font-size: 0.95rem;
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 10px 18px;
  cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--teal); }
button.go {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
  font-weight: 600;
}
button.go:hover:not(:disabled) { background: var(--teal-lift); }
button:disabled { opacity: 0.4; cursor: default; }

footer {
  color: var(--dim);
  font-size: 0.82rem;
  border-top: 1px solid var(--line);
  margin-top: 34px;
  padding-top: 14px;
}
@media (prefers-reduced-motion: reduce) {
  .bar i { transition: none; }
}
</style>
</head>
<body>
<main>
  <h1>Trstenko <span id="installed">—</span></h1>
  <p class="lede" id="lede">Reading the device.</p>

  <section id="pair" hidden>
    <h2>Pair with this device</h2>
    <p class="detail">Type the six digits shown on Trstenko's screen. They
      are unique to this device and only need entering once per visit.</p>
    <form id="pin-form" class="pinrow" autocomplete="off">
      <input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6"
             aria-label="Pairing PIN" placeholder="000000">
      <button class="go" type="submit">Pair</button>
    </form>
    <p class="detail" id="pin-error"></p>
  </section>

  <section id="update">
    <h2>Software</h2>
    <div id="update-body"></div>
    <div class="actions" id="actions"></div>
  </section>

  <section id="checks-section" hidden>
    <h2 id="checks-title">What is in the way</h2>
    <dl id="checks"></dl>
  </section>

  <section id="device-section">
    <h2>Device</h2>
    <dl id="device"></dl>
    <div class="actions" id="revert"></div>
  </section>

  <section id="about-section">
    <h2>This device</h2>
    <dl id="about"></dl>
    <p class="detail" id="ai-notice"></p>
  </section>

  <footer id="footer"></footer>
</main>

<script src="/app.js"></script>
</body>
</html>
